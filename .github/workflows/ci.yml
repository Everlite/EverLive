name: CI Build & Sanity Check

on:
  push:
    branches: [ main, dev, 'exp/*' ]
  pull_request:
    branches: [ main, dev, 'exp/*' ]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tmp_dir"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$tmp_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tmp_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp_dir/actionlint.tar.gz" -C "$tmp_dir" actionlint
          "$tmp_dir/actionlint"

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release hygiene (no patchers or compiled binaries)
        run: python3 tools/check_tree_hygiene.py

      - name: Release archive hygiene
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/archive"
          python3 tools/check_tree_hygiene.py --tree "$RUNNER_TEMP/archive"

      - name: Install userspace dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 --fix-missing \
            build-essential \
            clang \
            pkg-config \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libavcodec-dev \
            libswresample-dev \
            libswscale-dev \
            libavutil-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libgl-dev \
            python3

      - name: Compile everything (GCC)
        run: make -j"$(nproc)"

      - name: Compile display renderer (GCC, -Werror for the audio probe)
        run: |
          SDL_FLAGS="$(pkg-config --cflags --libs sdl2)"
          gcc -O2 -Wall -Wextra -Werror -c -o /tmp/everlive_audio_probe.o \
            tools/everlive/everlive_audio_probe.c
          gcc -O2 -Wall -Wextra -o /tmp/everlive_display \
            tools/everlive/everlive_display.c \
            tools/everlive/everlive_audio_probe.c \
            tools/libeverlive-core/third_party/jsmn.c \
            ${SDL_FLAGS} -lGL -lm -lX11 -lpthread

      - name: Verify no shell execution in the display audio path
        run: |
          if grep -nE 'popen[[:space:]]*\(|system[[:space:]]*\(|/bin/sh|python3' \
               tools/everlive/everlive_display.c; then
            echo "ERROR: shell execution is not allowed in the display audio path" >&2
            exit 1
          fi

      - name: Compile HWS UHD engine (GCC, opt-in)
        run: make hwsuhd

      - name: Unit tests (GCC)
        run: make -C tests clean test

      - name: Python unit tests
        run: python3 -m unittest discover -s tools/everlive/tests -v

      - name: Staged system-wide install and uninstall
        run: |
          make install DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr
          test -x "$RUNNER_TEMP/stage/usr/bin/everlive"
          test -x "$RUNNER_TEMP/stage/usr/bin/everlive-ctl"
          test -x "$RUNNER_TEMP/stage/usr/lib/everlive/tools/opengc573-userd/gc573_user_streamer"
          test -x "$RUNNER_TEMP/stage/usr/lib/everlive/tools/opengc570d-userd/opengc570d-userd"
          for module in everlive_client.py card_profile.py service_manager.py app_integrations.py everlive_recorder.py gc553g2_control.py ui_theme.py ui_widgets.py fa_icons.py everlive_multi.py everlive_cam.py; do
            test -f "$RUNNER_TEMP/stage/usr/lib/everlive/tools/everlive/$module"
          done
          for asset in fonts/fa-solid-900.ttf fonts/fa-brands-400.ttf fonts/LICENSE.txt fonts/chevron-down.png fonts/NotoSans-Regular.ttf fonts/NotoSans-SemiBold.ttf fonts/NotoSans-ExtraBold.ttf fonts/NotoSansMono-SemiBold.ttf fonts/NotoSans-LICENSE.txt; do
            test -f "$RUNNER_TEMP/stage/usr/lib/everlive/tools/everlive/$asset"
          done
          test -f "$RUNNER_TEMP/stage/usr/lib/libeverlive-vk-pacer.so"
          test -f "$RUNNER_TEMP/stage/usr/lib/libeverlive-cam-v4l2.so"
          test -x "$RUNNER_TEMP/stage/usr/lib/everlive/tools/everlive-cam/everlive_camd"
          test -x "$RUNNER_TEMP/stage/usr/libexec/everlive-vfio-bind"
          test -x "$RUNNER_TEMP/stage/usr/libexec/everlive-setcap"
          test -f "$RUNNER_TEMP/stage/usr/lib/udev/rules.d/70-everlive-vfio.rules"
          if command -v setcap >/dev/null 2>&1; then
            test ! -e "$RUNNER_TEMP/stage/etc/security/limits.d/99-everlive-memlock.conf"
          fi
          make uninstall DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr

      - name: Staged app-only install and uninstall
        run: |
          make install-app DESTDIR="$RUNNER_TEMP/appstage" PREFIX=/usr
          test -x "$RUNNER_TEMP/appstage/usr/bin/everlive"
          test -x "$RUNNER_TEMP/appstage/usr/bin/everlive_camd"
          test -x "$RUNNER_TEMP/appstage/usr/lib/everlive/play.sh"
          test -x "$RUNNER_TEMP/appstage/usr/lib/everlive/tools/everlive/everlive_viewer.py"
          test -f "$RUNNER_TEMP/appstage/usr/share/applications/everlive.desktop"
          test -f "$RUNNER_TEMP/appstage/usr/share/icons/hicolor/48x48/apps/everlive.png"
          test -f "$RUNNER_TEMP/appstage/usr/lib/libeverlive-cam-v4l2.so"
          make uninstall-app DESTDIR="$RUNNER_TEMP/appstage" PREFIX=/usr
          test ! -e "$RUNNER_TEMP/appstage/usr/lib/everlive"
          test ! -e "$RUNNER_TEMP/appstage/usr/bin/everlive"
          test ! -e "$RUNNER_TEMP/appstage/usr/bin/everlive_camd"
          test ! -e "$RUNNER_TEMP/appstage/usr/share/applications/everlive.desktop"

      - name: Frame generation cadence self-test
        run: make -C tools/opengc573-userd framegen-selftest

      - name: Compile everything (Clang)
        run: |
          make clean
          make CC=clang -j"$(nproc)"
          make CC=clang hwsuhd
          make CC=clang -C tests clean test
          SDL_FLAGS="$(pkg-config --cflags --libs sdl2)"
          clang -O2 -Wall -Wextra -o /tmp/everlive_display_clang \
            tools/everlive/everlive_display.c \
            tools/everlive/everlive_audio_probe.c \
            tools/libeverlive-core/third_party/jsmn.c \
            ${SDL_FLAGS} -lGL -lm -lX11 -lpthread

      - name: Sanitizer run
        run: make asan

      - name: ThreadSanitizer tests
        run: make tsan

      - name: Clean
        run: make clean

      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/everlive/everlive_viewer.py
          python3 -m py_compile tools/everlive/everlive_client.py
          python3 -m py_compile tools/everlive/card_profile.py
          python3 -m py_compile tools/everlive/service_manager.py
          python3 -m py_compile tools/everlive/app_integrations.py
          python3 -m py_compile tools/everlive/everlive_recorder.py
          python3 -m py_compile tools/everlive/gc553g2_control.py
          python3 -m py_compile tools/everlive/ui_theme.py
          python3 -m py_compile tools/everlive/ui_widgets.py
          python3 -m py_compile tools/everlive/fa_icons.py
          python3 -m py_compile tools/everlive/gen_osd_theme.py
          python3 -m py_compile tools/everlive/everlive_multi.py
          python3 -m py_compile tools/everlive/everlive_cam.py

      - name: Verify shell script syntax
        run: |
          bash -n install.sh
          bash -n install-experimental.sh
          bash -n uninstall.sh
          bash -n play.sh
          bash -n build.sh
          sh -n packaging/libexec/everlive-vfio-bind
          sh -n packaging/libexec/everlive-setcap
          sh -n tools/opengc573-userd/vfio_pci_bind.sh
          sh -n tools/opengc570d-userd/gc570d-vfio-bind.sh
          sh -n tools/openhws-userd/hws-vfio-bind.sh
          bash -n tools/opengc570d-userd/gc570d-sleep.sh
          bash -n tools/libeverlive-core/everlive-service.sh

      - name: Verify VFIO permission invariants
        run: |
          fail() { echo "ERROR: $*" >&2; exit 1; }
          if grep -R "new_id" packaging tools --include='*.sh' --include='*.rules' --include='*.conf'; then
            fail "new_id must not be used"
          fi
          if grep -E 'SUBSYSTEM=="vfio".*TAG\+="uaccess"' packaging/70-everlive.rules; then
            fail "VFIO group nodes must not use uaccess"
          fi
          if grep -R 'TAG+="uaccess"' packaging/70-everlive-vfio.rules \
               tools/opengc570d-userd/99-gc570d-vfio.rules \
               tools/openhws-userd/99-hwsuhd-vfio.rules; then
            fail "VFIO rules must not use uaccess"
          fi
          if grep -R --exclude-dir=__pycache__ 'LimitMEMLOCK=infinity' tools \
               --include='*.service' --include='*.py' --include='*.sh'; then
            fail "unlimited LimitMEMLOCK is not allowed"
          fi
          if grep -R -E 'memlock[[:space:]]+unlimited' packaging --include='*.conf' \
               tools --include='*.conf'; then
            fail "unlimited memlock is not allowed"
          fi
          if grep -R -E 'options[[:space:]]+vfio-pci[[:space:]]+ids=' packaging --include='*.conf' \
               tools --include='*.conf'; then
            fail "global vfio-pci ids= binding is not allowed"
          fi
          if command -v udevadm >/dev/null 2>&1 && udevadm verify --help >/dev/null 2>&1; then
            udevadm verify packaging/70-everlive.rules packaging/70-everlive-vfio.rules \
              tools/opengc570d-userd/99-gc570d-vfio.rules \
              tools/openhws-userd/99-hwsuhd-vfio.rules
          fi
