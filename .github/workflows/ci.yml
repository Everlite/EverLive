name: CI Build & Sanity Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install userspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            pkg-config \
            libsdl2-dev \
            libavcodec-dev \
            libswresample-dev \
            libswscale-dev \
            libavutil-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libgl-dev \
            python3

      - name: Compile everything (GCC)
        run: make -j"$(nproc)"

      - name: Unit tests (GCC)
        run: make -C tests clean test

      - name: Frame generation cadence self-test
        run: make -C tools/opengc573-userd framegen-selftest

      - name: Compile everything (Clang)
        run: |
          make clean
          make CC=clang -j"$(nproc)"
          make CC=clang -C tests clean test

      - name: Sanitizer run
        run: make -C tests asan

      - name: Clean
        run: make clean

      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/everlive/everlive_viewer.py
          python3 -m py_compile tools/everlive/everlive_client.py

      - name: Verify shell script syntax
        run: |
          bash -n install.sh
          bash -n install-experimental.sh
          bash -n uninstall.sh
          bash -n play.sh
          bash -n build.sh
          bash -n tools/opengc573-userd/vfio_pci_bind.sh
          bash -n tools/opengc570d-userd/gc570d-vfio-bind.sh
          bash -n tools/opengc570d-userd/gc570d-sleep.sh
          bash -n tools/libeverlive-core/everlive-service.sh
