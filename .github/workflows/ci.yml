name: CI Build & Sanity Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install userspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            pkg-config \
            libsdl2-dev \
            libavcodec-dev \
            libswresample-dev \
            libswscale-dev \
            libavutil-dev \
            libx11-dev \
            libgl-dev \
            python3

      - name: Compile EverLive Userspace Engine (GCC)
        run: |
          make -C tools/opengc573-userd -j"$(nproc)"
          make -C tools/opengc573-userd clean

      - name: Compile EverLive Userspace Engine (Clang)
        run: |
          make -C tools/opengc573-userd CC=clang -j"$(nproc)"

      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/everlive/everlive_viewer.py

      - name: Verify shell script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n play.sh
          bash -n build.sh
          bash -n tools/opengc573-userd/vfio_pci_bind.sh
