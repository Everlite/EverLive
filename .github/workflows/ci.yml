name: CI Build & Sanity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            linux-headers-generic \
            libsdl2-dev \
            libx11-dev \
            libgl-dev \
            python3

      - name: Locate Generic Kernel Headers
        id: kdir
        run: |
          GENERIC_KDIR=$(find /usr/src -maxdepth 1 -name "linux-headers-*-generic" | sort -V | tail -n 1)
          if [ -n "$GENERIC_KDIR" ] && [ -d "$GENERIC_KDIR" ]; then
            echo "kdir=$GENERIC_KDIR" >> "$GITHUB_OUTPUT"
            echo "Found generic kernel headers: $GENERIC_KDIR"
          else
            echo "kdir=/lib/modules/$(uname -r)/build" >> "$GITHUB_OUTPUT"
            echo "Fallback to default build directory: /lib/modules/$(uname -r)/build"
          fi

      - name: Compile open_gc573 kernel driver (GCC)
        run: |
          make -C open_gc573 KDIR="${{ steps.kdir.outputs.kdir }}"

      - name: Clean open_gc573 driver
        run: |
          make -C open_gc573 KDIR="${{ steps.kdir.outputs.kdir }}" clean

      - name: Compile open_gc573 kernel driver (Clang/LLVM)
        run: |
          if grep -Eq "CONFIG_CC_IS_CLANG=y" "${{ steps.kdir.outputs.kdir }}/.config" "${{ steps.kdir.outputs.kdir }}/include/config/auto.conf" 2>/dev/null; then
            echo "Kernel was built with Clang. Building module with LLVM=1 CC=clang..."
            make -C open_gc573 KDIR="${{ steps.kdir.outputs.kdir }}" LLVM=1 CC=clang
            make -C open_gc573 KDIR="${{ steps.kdir.outputs.kdir }}" clean
          else
            echo "Target kernel was compiled with GCC (CONFIG_CC_IS_GCC=y)."
            echo "Skipping LLVM=1 kernel build as Kbuild flags include GCC-specific options (-fconserve-stack, etc.)."
          fi

      - name: Compile EverLive direct display renderer (GCC & Clang)
        run: |
          gcc -O3 -Wall -Wextra tools/everlive/everlive_display.c -o tools/everlive/everlive_display $(sdl2-config --cflags --libs) -lGL -lX11 -lpthread -lm
          rm tools/everlive/everlive_display
          clang -O3 -Wall -Wextra tools/everlive/everlive_display.c -o tools/everlive/everlive_display $(sdl2-config --cflags --libs) -lGL -lX11 -lpthread -lm
          rm tools/everlive/everlive_display

      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/everlive/everlive_viewer.py

      - name: Verify shell script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n play.sh
          bash -n open_gc573/load.sh
          bash -n open_gc573/unload.sh
