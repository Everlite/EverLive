#
# EverLive fallback for systems without setcap.  This file is installed as
# /etc/security/limits.d/99-everlive-memlock.conf only when the engine
# binaries could not be given cap_ipc_lock=+ep.
#
# 1 GiB per process is bounded and comfortably covers the largest 4K
# multi-slot VFIO DMA ring.
@video  soft    memlock   1048576
@video  hard    memlock   1048576
